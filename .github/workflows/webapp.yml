name: Webapp

# Typecheck and unit-test the Next.js webapp backend (webapp/lib).
#
# DISABLED: automatic push/pull_request triggers were removed because the CI
# jobs were consistently failing. The workflow is kept for manual runs only
# (workflow_dispatch). Restore the push/pull_request triggers once the build is
# green again.

on:
  workflow_dispatch:

jobs:
  test:
    name: typecheck & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Unit tests
        working-directory: webapp
        run: npm test

      # Covers typecheck, repo-level script/skill checks, and the production
      # build; also re-runs the unit tests as part of the single entrypoint.
      - name: Smoke test
        run: bash scripts/smoke-test.sh
