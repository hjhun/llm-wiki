name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version tag, for example v0.2.0
        required: true
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    name: Validate release input
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v1.2.3, optionally with a suffix such as v1.2.3-rc.1" >&2
            exit 2
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag already exists: ${VERSION}" >&2
            exit 2
          fi

  build-cli-assets:
    name: Build CLI (${{ matrix.asset_suffix }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: ubuntu-x86_64
            bin_name: clio
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_suffix: windows-x86_64
            bin_name: clio.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_suffix: macos-x86_64
            bin_name: clio
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_suffix: macos-aarch64
            bin_name: clio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release-critical scripts
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          bash -n setup.sh
          bash -n scripts/install.sh
          bash -n systemd/install-clio-web-service.sh
          scripts/install.sh --help >/dev/null

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli-rs/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('cli-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Build CLI
        working-directory: cli-rs
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package CLI
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          BIN_NAME: ${{ matrix.bin_name }}
        run: |
          set -euo pipefail

          asset_stem="clio-${VERSION}-${ASSET_SUFFIX}"
          mkdir -p dist/package
          cp "cli-rs/target/${TARGET}/release/${BIN_NAME}" "dist/package/${BIN_NAME}"
          if [[ "${BIN_NAME}" != *.exe ]]; then
            chmod 0755 "dist/package/${BIN_NAME}"
          fi
          tar -czf "dist/${asset_stem}.tar.gz" -C dist/package "${BIN_NAME}"

      - name: Upload CLI asset
        uses: actions/upload-artifact@v4
        with:
          name: clio-${{ inputs.version }}-${{ matrix.asset_suffix }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-cli-assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump webapp version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          WEBAPP_VERSION="${VERSION#v}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm --prefix webapp version "${WEBAPP_VERSION}" --no-git-tag-version --allow-same-version

          if ! git diff --quiet -- webapp/package.json webapp/package-lock.json; then
            git add webapp/package.json webapp/package-lock.json
            git commit -m "Bump webapp version to ${VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Create tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "refs/tags/${VERSION}"

      - name: Prepare release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          notes_path="docs/releases/${VERSION}.md"
          if [[ -f "${notes_path}" ]]; then
            printf '%s\n' "${notes_path}" > .release-notes-path
          else
            printf 'CLIO %s\n\nSee the generated changelog for commit details.\n' "${VERSION}" > .release-notes.md
            printf '%s\n' ".release-notes.md" > .release-notes-path
          fi

      - name: Download CLI assets
        uses: actions/download-artifact@v4
        with:
          pattern: clio-${{ inputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          notes_file="$(cat .release-notes-path)"
          args=(
            "${VERSION}"
            dist/*.tar.gz
            --title "CLIO ${VERSION}"
            --notes-file "${notes_file}"
            --generate-notes
          )

          if [[ "${PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"
