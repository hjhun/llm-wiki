name: CLI Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to attach CLI assets to, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate CLI release input
    runs-on: ubuntu-latest

    steps:
      - name: Validate version and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v1.2.3, optionally with a suffix such as v1.2.3-rc.1" >&2
            exit 2
          fi

          gh release view "${VERSION}" >/dev/null

  build-cli-assets:
    name: Build CLI (${{ matrix.asset_suffix }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: ubuntu-x86_64
            bin_name: clio
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_suffix: windows-x86_64
            bin_name: clio.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_suffix: macos-x86_64
            bin_name: clio
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_suffix: macos-aarch64
            bin_name: clio

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli-rs/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('cli-rs/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-
            ${{ runner.os }}-cargo-

      - name: Build CLI
        working-directory: cli-rs
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package CLI
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          BIN_NAME: ${{ matrix.bin_name }}
        run: |
          set -euo pipefail

          asset_stem="clio-${VERSION}-${ASSET_SUFFIX}"
          mkdir -p dist/package
          cp "cli-rs/target/${TARGET}/release/${BIN_NAME}" "dist/package/${BIN_NAME}"
          if [[ "${BIN_NAME}" != *.exe ]]; then
            chmod 0755 "dist/package/${BIN_NAME}"
          fi
          tar -czf "dist/${asset_stem}.tar.gz" -C dist/package "${BIN_NAME}"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: clio-${{ inputs.version }}-${{ matrix.asset_suffix }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-cli-assets:
    name: Upload CLI assets to release
    needs: build-cli-assets
    runs-on: ubuntu-latest

    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: clio-${{ inputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Upload CLI assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          gh release upload "${VERSION}" dist/*.tar.gz --clobber
